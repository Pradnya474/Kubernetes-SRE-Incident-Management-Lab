apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  namespace: sre-lab
automountServiceAccountToken: false
---
# Read-only support role for inspecting pods and services in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-readonly
  namespace: sre-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-readonly-binding
  namespace: sre-lab
subjects:
  - kind: User
    name: sre-trainee
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: sre-readonly
  apiGroup: rbac.authorization.k8s.io
